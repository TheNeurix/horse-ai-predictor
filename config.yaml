# Configuration for Horse AI Predictor MVP 0.1

data:
  raw_dir: data/raw
  processed_dir: data/processed
  predictions_dir: data/predictions

model:
  name: baseline
  version: 0.1
  random_seed: 42
  input_features: []

betting:
  min_edge: 0.05
  stake_strategy: fixed
  fixed_stake: 10.0

evaluation:
  cv_strategy: chronological
  metrics:
    - accuracy
    - log_loss
    - top3_accuracy
